when:
  - event: push
    branch: main
    path:
      include:
        - extensions/compact-editor-chrome/**
        - packages/internal/**
        - .woodpecker/compact-editor-chrome.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
        - .oxlintrc.json
        - .oxfmtrc.json
        - .editorconfig
        - .gitignore
        - .changeset/config.json
      on_empty: false
  - event: pull_request
    path:
      include:
        - extensions/compact-editor-chrome/**
        - packages/internal/**
        - .woodpecker/compact-editor-chrome.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
        - .oxlintrc.json
        - .oxfmtrc.json
        - .editorconfig
        - .gitignore
        - .changeset/config.json
      on_empty: false

  - event: tag
    ref: "refs/tags/@eleith-pi/compact-editor-chrome@*"

workspace:
  base: /workspace
  path: src

steps:
  prepare:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - corepack prepare pnpm@11.2.2 --activate
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile

  checks:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
      PI_OFFLINE: "1"
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - pnpm exec oxfmt --check extensions/compact-editor-chrome packages/internal .woodpecker/compact-editor-chrome.yml package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json .oxlintrc.json .oxfmtrc.json .editorconfig .gitignore .changeset/config.json
      - pnpm --filter @eleith-pi/compact-editor-chrome --filter @eleith/pi-internal lint
      - pnpm --filter @eleith-pi/compact-editor-chrome --filter @eleith/pi-internal check
      - pnpm --filter @eleith-pi/compact-editor-chrome --filter @eleith/pi-internal test

  build:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - pnpm --filter @eleith-pi/compact-editor-chrome build

  check-version:
    image: node:26
    commands:
      - |
        set -eu
        VERSION_FROM_TAG="$${CI_COMMIT_TAG#@eleith-pi/compact-editor-chrome@}"
        VERSION_FROM_PKG="$$(node -p "require('./extensions/compact-editor-chrome/package.json').version")"

        if [ "$${VERSION_FROM_TAG}" != "$${VERSION_FROM_PKG}" ]; then
          echo "Version mismatch: Git tag version $${VERSION_FROM_TAG} does not match extensions/compact-editor-chrome/package.json version: $${VERSION_FROM_PKG}"
          exit 1
        fi
        if [ "$${VERSION_FROM_PKG}" = "0.0.0" ]; then
          echo "Refusing to publish @eleith-pi/compact-editor-chrome at placeholder version 0.0.0"
          exit 1
        fi
    when:
      - event: tag

  publish:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
      NPM_CONFIG_USERCONFIG: /workspace/src/.cache/compact-editor-chrome-publish.npmrc
      NPM_TOKEN:
        from_secret: gitea_npm_token
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - |
        set -eu
        test -n "$${NPM_TOKEN}"
        VERSION="$$(node -p "require('./extensions/compact-editor-chrome/package.json').version")"
        umask 077
        mkdir -p .cache
        trap 'rm -f "$${NPM_CONFIG_USERCONFIG}"' EXIT
        printf '%s\n' '//git.eleith.com/api/packages/eleith.private/npm/:_authToken=$${NPM_TOKEN}' > "$${NPM_CONFIG_USERCONFIG}"

        if npm view "@eleith-pi/compact-editor-chrome@$${VERSION}" version --json --registry=https://git.eleith.com/api/packages/eleith.private/npm/ > .cache/compact-editor-chrome-registry.json 2>/dev/null; then
          echo "@eleith-pi/compact-editor-chrome@$${VERSION} is already published; skipping"
          exit 0
        fi
        node -e 'const result = require("./.cache/compact-editor-chrome-registry.json"); if (result.error?.code !== "E404") throw new Error("Registry lookup failed; refusing to publish");'
        pnpm --filter @eleith-pi/compact-editor-chrome publish --registry=https://git.eleith.com/api/packages/eleith.private/npm/ --no-git-checks
    when:
      - event: tag

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - event: [push, tag]
        status: [success]

  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - event: [push, tag]
        status: [failure]
