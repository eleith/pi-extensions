when:
  - event: push
    branch: main
  - event: pull_request

workspace:
  base: /workspace
  path: src

steps:
  prepare:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - corepack prepare pnpm@11.2.2 --activate
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile

  checks:
    image: node:26
    environment:
      COREPACK_HOME: /workspace/src/.corepack
      PI_OFFLINE: "1"
    commands:
      - npm install --global corepack@latest
      - corepack enable
      - pnpm format:check
      - pnpm lint
      - pnpm typecheck
      - pnpm test
